default_profile: mega
profiles:
  mega:
    notes: Mega 2560 build using vendored libraries in ./libraries, isolated from the Arduino sketchbook.
    fqbn: arduino:avr:mega
    platforms:
      - platform: arduino:avr (1.8.8)
    libraries:
      # Vendored libraries (versions not pinned; set by ./libraries content)
      - dir: libraries/Time              # Time 1.5
      - dir: libraries/DS323RTC          # DS3232RTC (no library.properties)
      - dir: libraries/SdFat             # SdFat 1.0.14
      - dir: libraries/SparkFun_BME280   # SparkFun BME280 1.1.0
      - dir: libraries/Adafruit_INA219   # Adafruit INA219_5A 1.0.0
      - Ethernet (2.0.2)                 # from library manager (pinned)
