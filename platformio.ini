; PlatformIO project for the ArduinoWeatherStation.
; Converts the previous arduino-cli / arduino-ide layout (sketch.yaml, compile.*, upload.bat)
; into the standard PlatformIO layout:
;   src/            - sketch sources (merged like the Arduino IDE: main .ino first, then alphabetically)
;   libraries/      - vendored third-party libraries, committed directly in the repo
;   platformio.ini  - this file

; Two board variants. `mega` is the default and uses the legacy wind-vane/cup
; anemometer (no USE_WS85). `mega-ws85` adds the WS85 ultrasonic anemometer via
; the USE_WS85 build flag. `pio run` builds both; use `pio run -e <name>` to
; build just one.

[platformio]
src_dir = src

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Vendored libraries committed directly under ./libraries (not submodules).
; Their versions are frozen in place, exactly like the old sketch.yaml "dir:" entries.
;   Time                Time 1.5
;   DS323RTC            DS3232RTC 1.0 (JChristensen, no library.properties - legacy layout)
;   SdFat               SdFat 1.0.14
;   SparkFun_BME280     SparkFun BME280 1.1.0
;   Adafruit_INA219     Adafruit INA219_5A 1.0.0 (crestlinesoaring fork)
lib_extra_dirs = libraries

; Ethernet from the Library Manager, pinned like the old sketch.yaml entry.
lib_deps =
    arduino-libraries/Ethernet@2.0.2

monitor_speed = 115200

; Adds the WS85 ultrasonic anemometer on top of the default mega build.
[env:mega-ws85]
extends = env:mega
build_flags = -DUSE_WS85